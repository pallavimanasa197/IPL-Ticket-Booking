
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Ticket Booking</title>
    <link rel="stylesheet" href="styles.css">

    <style>
        .booking-container {
            max-width: 650px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .booking-container h1 {
            text-align: center;
            color: #172554;
            margin-bottom: 25px;
        }

        .booking-form label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        .booking-form input,
        .booking-form select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            box-sizing: border-box;
        }

        .booking-form input[type="radio"],
        .booking-form input[type="checkbox"] {
            width: auto;
        }

        .booking-buttons {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .booking-buttons button {
            padding: 12px 20px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .submit-btn {
            background: #f59e0b;
            color: white;
        }

        .reset-btn {
            background: #172554;
            color: white;
        }

        .booking-form button:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>

<header>
    <nav>
        <a href="index.html">Home</a>
        <a href="index.html#matches">Matches</a>
        <a href="booking.html">Book Ticket</a>
    </nav>
</header>

<div class="booking-container">

    <h1>🏏 IPL Ticket Booking Form</h1>

    <form class="booking-form" action="#" method="get">

        <label for="name">Full Name</label>
        <input type="text" id="name" name="name"
               placeholder="Enter your full name"
               minlength="3" maxlength="40" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email"
               placeholder="example@gmail.com" required>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone"
               placeholder="10-digit mobile number"
               pattern="[6-9][0-9]{9}"
               minlength="10" maxlength="10"
               title="Enter a valid 10-digit Indian mobile number"
               required>

        <label for="match">Select Match</label>
        <select id="match" name="match" required>
            <option value="">-- Select Match --</option>
            <option value="RCB vs CSK">RCB vs CSK</option>
            <option value="MI vs KKR">MI vs KKR</option>
            <option value="SRH vs RR">SRH vs RR</option>
            <option value="GT vs DC">GT vs DC</option>
        </select>

        <label for="stand">Stand Category</label>
        <select id="stand" name="stand" required>
            <option value="">-- Select Stand --</option>
            <option value="General">General</option>
            <option value="Premium">Premium</option>
            <option value="VIP">VIP</option>
        </select>

        <label for="tickets">Number of Tickets</label>
        <input type="number" id="tickets" name="tickets"
               min="1" max="10" required
               placeholder="Maximum 10 tickets">

        <label>Additional Preference</label>

        <input type="radio" id="family" name="preference"
               value="Family Seating" required>
        <label for="family">Family Seating</label>

        <input type="radio" id="friends" name="preference"
               value="Friends Seating">
        <label for="friends">Friends Seating</label>

        <div class="booking-buttons">
            <button type="submit" class="submit-btn">
                Submit Booking
            </button>

            <button type="reset" class="reset-btn">
                Reset Form
            </button>
        </div>

    </form>

</div>

</body>
</html>
