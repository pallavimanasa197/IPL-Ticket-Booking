
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IPL Ticket Booking</title>

    <link rel="stylesheet" href="styles.css">

    <!-- JavaScript File -->
    <script src="app.js" defer></script>
</head>

<body>

    <header>
        <h1>IPL Ticket Booking</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#matches">Matches</a>
            <a href="booking.html">Book Ticket</a>
            <a href="index.html#guidelines">Guidelines</a>
        </nav>
    </header>

    <main>

        <h2>Book Your IPL Tickets</h2>
        <p>Fill in the details below to reserve your seats!</p>

        <!-- Booking Form -->
        <form id="bookingForm" action="#" method="get">

            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name"
                   placeholder="Enter your name"
                   required minlength="3" maxlength="30">

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email"
                   required>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone"
                   placeholder="10-digit mobile number"
                   pattern="[6-9][0-9]{9}"
                   title="Enter a valid 10-digit Indian mobile number"
                   required>

            <!-- Match Selection -->
            <label for="match">Select Match:</label>
            <select id="match" name="match" required>
                <option value="">-- Choose a Match --</option>
                <option value="CSK vs MI">CSK vs MI</option>
                <option value="RCB vs KKR">RCB vs KKR</option>
                <option value="SRH vs CSK">SRH vs CSK</option>
                <option value="MI vs RCB">MI vs RCB</option>
            </select>

            <!-- Stand Selection -->
            <label for="stand">Stand Category:</label>
            <select id="stand" name="stand" required>
                <option value="">-- Select Stand --</option>
                <option value="General">General Stand</option>
                <option value="Premium">Premium Stand</option>
                <option value="VIP">VIP Stand</option>
                <option value="Corporate">Corporate Box</option>
            </select>

            <!-- Ticket Quantity -->
            <label for="tickets">Number of Tickets:</label>
            <input type="number" id="tickets" name="tickets"
                   min="1" max="10" value="1" required>

            <!-- Additional Preferences -->
            <fieldset>
                <legend>Additional Preferences</legend>

                <label>
                    <input type="radio" name="preference"
                           value="Regular" required>
                    Regular Seating
                </label>

                <label>
                    <input type="radio" name="preference"
                           value="Near Boundary">
                    Near Boundary
                </label>
            </fieldset>

            <!-- Form Buttons -->
            <div class="form-buttons">
                <button type="submit">Confirm Booking</button>
                <button type="reset">Reset Form</button>
            </div>

        </form>

        <!-- Activity 7: Booking Summary Card -->
        <div class="summary-card">

            <h2>Booking Summary</h2>

            <p>
                Match:
                <span id="summaryMatch">Not Selected</span>
            </p>

            <p>
                Stand:
                <span id="summaryStand">Not Selected</span>
            </p>

            <p>
                Tickets:
                <span id="summaryQuantity">0</span>
            </p>

            <h3>
                Total Price: ₹<span id="totalPrice">0</span>
            </h3>

        </div>

    </main>

    <footer>
        <p>© 2026 IPL Ticket Booking. All Rights Reserved.</p>
    </footer>

</body>
</html>
